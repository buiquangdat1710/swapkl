name: llama
model:
  pretrained_model_name_or_path: meta-llama/Llama-3.1-8B
  cache_dir: null
  return_dict: true
  load_in_8bit: false
  load_in_4bit: false
  device_map: auto
  low_cpu_mem_usage: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  rope_theta: 500000.0

attention:
  attention_type: softmax
